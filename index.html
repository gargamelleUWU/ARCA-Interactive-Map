<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARCA Interactive Map</title>
    <!-- CSS loaded in  the head-->
    <!-- CSS for leaflet-->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <!-- CSS for markerCluster-->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <!-- My Custom CSS-->
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <!-- Search Box Section -->
    <!-- FIXED: Changed 'is' to 'id' -->
    <div id="sidebar-wrapper" class="sidebar-wrapper">
        <div class="map-controls">
            <div class="search-row">
                <input type="text" id="searchName" placeholder="Search Centre Name...">
                <input type="text" id="searchCity" placeholder="Search City...">
                <button id="resetFiltersBtn" class="arca-btn">Clear Filters</button>
            </div>

            <!-- Discipline Filter Checkbox Section -->
            <div class="filter-group" id="filterDisciplineGroup">
                <div class="filter-title">Disciplines</div>
                <div class="pill-container">
                    <label class="arca-checkbox-pill">
                        <input type="checkbox" class="filter-discipline" value="Architecture">
                        <span>Architecture</span>
                    </label>
                    <label class="arca-checkbox-pill">
                        <input type="checkbox" class="filter-discipline" value="Crafts">
                        <span>Crafts</span>
                    </label>
                    <label class="arca-checkbox-pill">
                        <input type="checkbox" class="filter-discipline" value="Film/Video">
                        <span>Film and Video</span>
                    </label>
                    <label class="arca-checkbox-pill">
                        <input type="checkbox" class="filter-discipline" value="Interdisciplinary">
                        <span>Interdisciplinary</span>
                    </label>
                    <label class="arca-checkbox-pill">
                        <input type="checkbox" class="filter-discipline" value="Media and Digital Arts">
                        <span>Media and Digital Arts</span>
                    </label>
                    <label class="arca-checkbox-pill">
                        <input type="checkbox" class="filter-discipline" value="Performance and Live Arts">
                        <span>Performance and Live Arts</span>
                    </label>
                    <label class="arca-checkbox-pill">
                        <input type="checkbox" class="filter-discipline" value="Printmaking">
                        <span>Printmaking</span>
                    </label>
                    <label class="arca-checkbox-pill">
                        <input type="checkbox" class="filter-discipline" value="Publications and Publishing">
                        <span>Publications and Publishing</span>
                    </label>
                    <label class="arca-checkbox-pill">
                        <input type="checkbox" class="filter-discipline" value="Sound Art and Music">
                        <span>Sound Art and Music</span>
                    </label>
                    <label class="arca-checkbox-pill">
                        <input type="checkbox" class="filter-discipline" value="Visual Arts">
                        <span>Visual Arts</span>
                    </label>
                </div>
            </div>

            <!-- Centre Type Filter Section -->
            <div class="filter-group" id="filterTypeGroup">
                <div class="filter-title">Centre Type</div>
                <div class="pill-container">
                    <label class="arca-checkbox-pill">
                        <input type="checkbox" class="filter-type" value="Artists' Residencies">
                        <span>Artists' Residencies</span>
                    </label>
                    <label class="arca-checkbox-pill">
                        <input type="checkbox" class="filter-type" value="No Fixed Location">
                        <span>Centre Without Fixed Location</span>
                    </label>
                    <label class="arca-checkbox-pill">
                        <input type="checkbox" class="filter-type" value="Distribution Centre">
                        <span>Distribution Centre</span>
                    </label>
                    <label class="arca-checkbox-pill">
                        <input type="checkbox" class="filter-type" value="Exhibition Centre">
                        <span>Exhibition Centre</span>
                    </label>
                    <label class="arca-checkbox-pill">
                        <input type="checkbox" class="filter-type" value="Information Centre">
                        <span>Information Centre</span>
                    </label>
                    <label class="arca-checkbox-pill">
                        <input type="checkbox" class="filter-type" value="Production Centre">
                        <span>Production Centre</span>
                    </label>
                    <label class="arca-checkbox-pill">
                        <input type="checkbox" class="filter-type" value="Publisher">
                        <span>Publisher</span>
                    </label>
                </div>
            </div>
        </div>
        <button id="collapseBtn" class="collapse-toggle">◀</button>
    </div>

    <!-- FIXED: Map div is now empty and immediately closed -->
    <div id="map"></div>

    <!-- 1. Main Leaflet Library -->
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>

    <!-- 2. MarkerCluster Plugin (MUST come after Leaflet) -->
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

    <!-- 3. Your Custom Code (MUST come last) -->
    <script src="script.js"></script>
</body>

</html>
