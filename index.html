<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARCA Interactive Map</title>
    <!-- CSS loaded in  the head-->
    <!-- CSS for leaflet-->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <!-- CSS for markerCluster-->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <!-- My Custom CSS-->
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <div class="map-controls">
        <!-- Search Bar-->
        <input type="text" id="searchName" placeholder="Search by name...">
        <!-- Discipline Filter (Make Check Boxes so multiple can be selected)-->
        <select id="filterType">
            <option value="all">All Types</option>
            <option value="Architecture">Architecture</option>
            <option value="Crafts">Crafts</option>
            <option value="Film/Video">Film/Video</option>
            <option value="Interdisciplinary">Interdisciplinary</option>
            <option value="Media and Digital Arts">Media and Digital Arts</option>
            <option value="Performance and Live Arts">Performance and Live Arts</option>
            <option value="Printmaking">Printmaking</option>
            <option value="Publications and Publishing">Publications and Publishing</option>
            <option value="Sound Art and Music">Sound Art and Music</option>
            <option value="Visual Arts">Visual Arts</option>
        </select>
        <!--City Filter-->
        <select id="filterCity">
            <option value="all">All Cities</option>
            <option value="Montreal">Montreal</option>
            <option value="Toronto">Toronto</option>
        </select>
        <!--Add Association Filter-->
        <!--Add Province Filter-->
        <!--Add all other filters-->
    </div>

    <div id="map"></div>

    <!-- 1. Main Leaflet Library -->
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>

    <!-- 2. MarkerCluster Plugin (MUST come after Leaflet) -->
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

    <!-- 3. Your Custom Code (MUST come last) -->
    <!--Map Logic-->
    <script src="script.js"></script>
</body>

</html>
